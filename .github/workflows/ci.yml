name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - 'LICENSE'
      - 'docs/**'
      - '.gitignore'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew jar --build-cache --configuration-cache --no-daemon --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EP-XPcheckin
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
